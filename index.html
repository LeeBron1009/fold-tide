<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071614"><title>折潮・修正版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071614;color:#f4efe4;font:15px system-ui,"Microsoft JhengHei",sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}button{font:inherit;border:1px solid #776f51;border-radius:14px;padding:12px 16px;background:#182c29;color:#eee7d7;cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:#e7d3a1;color:#172421;font-weight:bold}.hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:7px;padding:10px;pointer-events:none}.stat{background:#0c211edb;border:1px solid #465449;border-radius:12px;padding:7px 10px;min-width:60px}.stat small{display:block;color:#d7c798;font-size:11px}.hud button{margin-left:auto;pointer-events:auto;padding:8px 12px}.overlay{position:fixed;inset:0;background:#03120fc7;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.card{width:min(510px,100%);max-height:88dvh;overflow:auto;background:#102421;border:1px solid #6d7054;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0006}h1{font-size:42px;letter-spacing:.15em;margin:8px 0}h2{margin:0 0 12px}.en{color:#8fd0c8;letter-spacing:.22em;font-size:12px}p{line-height:1.75;color:#dce4d9}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}.choice{display:block;width:100%;text-align:left;margin:10px 0;line-height:1.7}.choice strong{display:block;color:#e7d3a1}.note{font-size:12px;color:#a7bfb3}.hidden{display:none!important}#toast{position:fixed;top:23%;left:0;right:0;text-align:center;pointer-events:none;color:#e7d3a1;font-size:22px;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s}#bottom{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:10px;right:10px;text-align:center;color:#a9c4b9;font-size:12px;pointer-events:none}@media(max-width:420px){.hud{gap:4px;padding:7px}.stat{min-width:49px;padding:6px 7px}.hud button{padding:6px 8px}.card{padding:19px}}
</style></head><body>
<canvas id="canvas"></canvas><div class="hud"><div class="stat"><small>分數</small><span id="score">0</span></div><div class="stat"><small>潮次</small><span id="wave">1</span></div><div class="stat"><small>潮息</small><span id="hp">100</span></div><div class="stat"><small>潮屑</small><span id="money">0</span></div><button id="pause" class="hidden">暫停</button></div><div id="toast"></div><div id="bottom">點擊放折光 · 拖曳決定角度</div><div id="overlay" class="overlay"><div id="panel" class="card"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const KEY='foldtide-fixed-v4';let meta={best:0,money:0,life:0,health:0,bonus:0,ach:[],skin:'gold',daily:{}};
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)Object.assign(meta,old)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(meta))}catch(e){}}
let W=0,H=0,A={},state='menu',g=null,mode='endless',pointer=null,sound=true,audio=null,toastEnd=0;
const themes=[['墨潮',168],['金沙',38],['霜潮',204],['夜螢',280]];
function resize(){const before=A;W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);A={x:W/2,y:(H+70)/2,r:Math.max(45,Math.min(W*.44,(H-160)*.46))};if(g&&before.r){const k=A.r/before.r;for(const o of [g.p,...g.spores,...g.reefs,...g.items]){o.x=A.x+(o.x-before.x)*k;o.y=A.y+(o.y-before.y)*k;if(o.ox!==undefined){o.ox=A.x+(o.ox-before.x)*k;o.oy=A.y+(o.oy-before.y)*k}}if(g.boss){g.boss.x=A.x;g.boss.y=A.y}g.mirrors=[];g.p.trail=[];pointer=null} }
addEventListener('resize',resize);resize();
function beep(f=500){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.frequency.value=f;v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.14)}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;toastEnd=performance.now()+1500}
function show(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden');$('pause').classList.add('hidden');pointer=null}
function button(id,text,fn,cls=''){const b=document.createElement('button');b.id=id;b.textContent=text;b.className=cls;b.onclick=fn;return b}
function row(actions){const r=document.createElement('div');r.className='row';for(const [text,fn,cls]of actions)r.append(button('',text,fn,cls||''));$('panel').append(r)}
function menu(){state='menu';hud();show(`<div class="en">FOLDTIDE · FIXED EDITION</div><h1>折潮</h1><p>你不直接控制白色脈衝，而是畫下折光，讓它反彈、收集孢子。每五潮挑戰潮核。</p><p class="note">點一下快速放置垂直於行進方向的折光；拖曳自訂角度。最多保留五片。撞牆扣潮息，收集孢子回復。每潮開場有三秒護航。</p><p>最高 ${meta.best}　潮屑 ${meta.money}<br>成就 ${meta.ach.length}/6</p>`);row([['無盡潮',()=>start('endless'),'primary'],['每日潮',()=>start('daily')],['練習',()=>start('practice')]]);row([['永久強化',shop],['圖鑑／成就',codex],['音效：'+(sound?'開':'關'),()=>{sound=!sound;menu()}]]);$('bottom').textContent='修正版 v4 · 不依賴外部套件 · 單檔可玩'}
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function day(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function maxHP(){return mode==='daily'?100:100+meta.health*12}
function start(m){mode=m;g={wave:1,score:0,hp:100,time:0,spores:[],reefs:[],items:[],mirrors:[],particles:[],p:null,boss:null,combo:0,comboTimer:0,slow:0,grace:3,damageCD:0,echo:0,echoTimer:0,echoReady:0,collected:0,cleared:0,earned:0,runLife:0,runCombo:0,nextSlow:false,rng:m==='daily'?seeded(Number(day().replaceAll('-',''))):Math.random};g.hp=maxHP();beep(300);nextWave()}
function random(){return g.rng()}
function nextWave(){state='play';$('overlay').classList.add('hidden');$('pause').classList.remove('hidden');g.spores=[];g.reefs=[];g.items=[];g.mirrors=[];g.boss=null;g.grace=3;g.damageCD=0;g.echo=0;g.echoReady=0;pointer=null;const n=g.wave,boss=n%5===0,count=boss?3:Math.min(12,3+Math.floor(n*.55));for(let i=0;i<count;i++){const a=2*Math.PI*i/count+random()*.5,r=A.r*(.3+(i%3)*.16);let kind='normal';if(n>=2&&i===0)kind='gold';else if(n>=8&&i%5===2)kind='wisp';else if(n>=6&&i%4===1)kind='split';else if(n>=4&&i%3===0)kind='orbit';const x=A.x+Math.cos(a)*r,y=A.y+Math.sin(a)*r;g.spores.push({x,y,ox:x,oy:y,r:kind==='wisp'?9:12,kind,angle:a,alive:true})}
if(n>=3){for(let i=0;i<Math.min(4,Math.floor(n/3));i++){let found=null;for(let tries=0;tries<30;tries++){const a=random()*Math.PI*2,r=A.r*(.38+random()*.36),o={x:A.x+Math.cos(a)*r,y:A.y+Math.sin(a)*r,r:Math.min(20,A.r*.09)};if([...g.spores,...g.reefs].every(s=>Math.hypot(s.x-o.x,s.y-o.y)>s.r+o.r+24)){found=o;break}}if(found)g.reefs.push(found)}}
if(n>=2&&random()<.65){const a=random()*6.283;g.items.push({x:A.x+Math.cos(a)*A.r*.22,y:A.y+Math.sin(a)*A.r*.22,r:11,kind:['heal','slow','long'][Math.floor(random()*3)]})}
if(boss)g.boss={x:A.x,y:A.y,r:Math.min(27,A.r*.13),hp:3+Math.floor(n/5),cool:0};const angle=random()*Math.PI*2,speed=Math.min(310,(mode==='practice'?95:125)+n*7)*(g.nextSlow?.8:1);g.nextSlow=false;g.p={x:A.x+Math.cos(angle)*A.r*.22,y:A.y+Math.sin(angle)*A.r*.22,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,trail:[]};toast((boss?'潮核挑戰':themes[Math.floor((n-1)/3)%4][0])+' · 第 '+n+' 潮');hud()}
function hud(){$('score').textContent=g?g.score:0;$('wave').textContent=g?g.wave:1;$('hp').textContent=g?Math.ceil(Math.max(0,g.hp)):100;$('money').textContent=meta.money}
function achievement(id){if(mode==='practice'||meta.ach.includes(id))return;meta.ach.push(id);save();toast('成就：'+id)}
function points(n){g.score+=Math.round(n*(mode==='daily'?1:1+meta.bonus*.06))}
function damage(n){if(mode==='practice'||g.grace>0||g.damageCD>0)return;g.hp=Math.max(0,g.hp-n);g.damageCD=.6;g.combo=0;beep(110);if(g.hp<=0)end(false)}
function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*6.283,s=30+Math.random()*65;g.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.6,color})}}
function collect(s){if(!s.alive)return;s.alive=false;g.collected++;g.combo=g.comboTimer>0?g.combo+1:1;g.comboTimer=1.7+g.runCombo;points((s.kind==='gold'?220:s.child?60:100)*Math.min(g.combo,8));g.hp=Math.min(maxHP(),g.hp+(s.kind==='gold'?12:5));burst(s.x,s.y,s.kind==='gold'?'#e7d3a1':'#8fd0c8');beep(450+g.combo*35);if(g.combo>=5)achievement('五連擊');if(g.collected>=30)achievement('採集三十');if(s.kind==='split'){for(const sign of[-1,1]){let x=s.x+sign*19,y=s.y,dx=x-A.x,dy=y-A.y,d=Math.hypot(dx,dy);if(d>A.r-22){x=A.x+dx/d*(A.r-22);y=A.y+dy/d*(A.r-22)}g.spores.push({x,y,r:8,kind:'normal',child:true,alive:true})}}}
function normalizeReflect(nx,ny){const p=g.p,d=p.vx*nx+p.vy*ny;p.vx-=2*d*nx;p.vy-=2*d*ny}
// All movement uses seconds and pixels/second. Small physics substeps prevent tunnelling.
function physics(dt){const p=g.p,scale=g.slow>0?.55:1;p.x+=p.vx*dt*scale;p.y+=p.vy*dt*scale;
let dx=p.x-A.x,dy=p.y-A.y,d=Math.hypot(dx,dy),limit=A.r-7;if(d>limit){const nx=dx/d,ny=dy/d;p.x=A.x+nx*(limit-.1);p.y=A.y+ny*(limit-.1);if(p.vx*nx+p.vy*ny>0)normalizeReflect(nx,ny);damage(6+g.wave*.25);if(state!=='play')return}
for(const m of g.mirrors){if(m.cool>0)continue;const sx=m.x2-m.x1,sy=m.y2-m.y1,l2=sx*sx+sy*sy,t=Math.max(0,Math.min(1,((p.x-m.x1)*sx+(p.y-m.y1)*sy)/l2)),qx=m.x1+sx*t,qy=m.y1+sy*t;dx=p.x-qx;dy=p.y-qy;d=Math.hypot(dx,dy);if(d<9){let nx,ny;if(d>.0001){nx=dx/d;ny=dy/d}else{const l=Math.sqrt(l2);nx=-sy/l;ny=sx/l;if(p.vx*nx+p.vy*ny>0){nx=-nx;ny=-ny}}p.x=qx+nx*9.2;p.y=qy+ny*9.2;if(p.vx*nx+p.vy*ny<0){normalizeReflect(nx,ny);beep(620);g.echo=g.echoTimer>0?g.echo+1:1;g.echoTimer=2;if(g.echo>=3){g.echo=0;g.echoReady=1;toast('三折回聲')}}m.cool=.12}}
for(const r of [...g.reefs,...(g.boss?[g.boss]:[])]){dx=p.x-r.x;dy=p.y-r.y;d=Math.hypot(dx,dy);if(d<r.r+7){const nx=d>.001?dx/d:1,ny=d>.001?dy/d:0;p.x=r.x+nx*(r.r+7.2);p.y=r.y+ny*(r.r+7.2);if(p.vx*nx+p.vy*ny<0)normalizeReflect(nx,ny);if(r===g.boss){if(r.cool<=0){r.hp--;r.cool=.45;points(150);burst(r.x,r.y,'#e7d3a1');beep(260);if(r.hp<=0){g.boss=null;points(500);if(mode!=='practice')g.earned+=3;achievement('潮核碎裂');toast('潮核碎裂')}}}else damage(9);if(state!=='play')return}}
for(const s of [...g.spores])if(s.alive&&Math.hypot(p.x-s.x,p.y-s.y)<s.r+7)collect(s);
if(g.echoReady>0){const target=g.spores.find(s=>s.alive&&Math.hypot(p.x-s.x,p.y-s.y)<85);if(target){collect(target);g.echoReady=0}}
for(const u of g.items){if(u.taken||Math.hypot(p.x-u.x,p.y-u.y)>u.r+7)continue;u.taken=true;if(u.kind==='heal')g.hp=Math.min(maxHP(),g.hp+22);if(u.kind==='slow')g.slow=4;if(u.kind==='long')for(const m of g.mirrors){m.life+=2;m.max+=2}toast({heal:'回息 +22',slow:'緩潮 4 秒',long:'場上折光延長 2 秒'}[u.kind]);beep(780)}g.items=g.items.filter(u=>!u.taken)
}
function tick(dt){g.time+=dt;for(const k of['grace','damageCD','slow','comboTimer','echoTimer','echoReady'])g[k]=Math.max(0,g[k]-dt);if(g.boss)g.boss.cool=Math.max(0,g.boss.cool-dt);for(const m of g.mirrors){m.life-=dt;m.cool=Math.max(0,m.cool-dt)}g.mirrors=g.mirrors.filter(m=>m.life>0);for(const s of g.spores)if(s.alive&&(s.kind==='orbit'||s.kind==='wisp')){s.angle+=dt*(s.kind==='wisp'?1.6:.65);s.x=s.ox+Math.cos(s.angle)*14;s.y=s.oy+Math.sin(s.angle)*14}
const count=Math.max(1,Math.ceil(Math.hypot(g.p.vx,g.p.vy)*dt/2));for(let i=0;i<count;i++){physics(dt/count);if(state!=='play')return}g.p.trail.push({x:g.p.x,y:g.p.y});if(g.p.trail.length>25)g.p.trail.shift();for(const p of g.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}g.particles=g.particles.filter(p=>p.t>0);
if(!g.boss&&g.spores.every(s=>!s.alive)){g.cleared++;points(g.wave*70);if(mode!=='practice')g.earned++;g.hp=Math.min(maxHP(),g.hp+10);if(g.wave===1)achievement('初潮完成');if(g.wave===5)achievement('五潮之後');if(g.wave===10)achievement('十潮');g.wave++;if(g.wave%2===0)upgrade();else nextWave()}hud()}
function upgrade(){state='upgrade';show('<h2>潮間強化</h2><p>選一個本局強化，然後繼續。</p>');const options=[['持久折光','本局折光壽命 +0.4 秒',()=>g.runLife+=.4],['回息','立刻回復 25 潮息',()=>g.hp=Math.min(maxHP(),g.hp+25)],['放慢下一潮','下一潮速度降低 20%',()=>g.nextSlow=true],['連擊餘韻','本局連擊時間 +0.3 秒',()=>g.runCombo+=.3]];for(let i=options.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}for(const [title,desc,fn]of options.slice(0,3)){const b=button('', '',()=>{fn();nextWave()},'choice');b.innerHTML='<strong>'+title+'</strong>'+desc;$('panel').append(b)}}
function end(quit){if(state==='over')return;state='over';pointer=null;meta.best=Math.max(meta.best,g.score);meta.money+=g.earned;if(mode==='daily')meta.daily[day()]=Math.max(meta.daily[day()]||0,g.score);save();hud();show(`<div class="en">TIDE NOTE</div><h1>${quit?'潮停於此':'潮散'}</h1><p>到達第 ${g.wave} 潮，完成 ${g.cleared} 潮。<br>分數 ${g.score}　最高 ${meta.best}<br>本局獲得 ${g.earned} 潮屑。</p><p class="note">${mode==='practice'?'練習模式不扣潮息、不發潮屑。':mode==='daily'?'每日潮不套用永久強化，依裝置當地日期產生。':'潮屑可在封面購買永久強化。'}</p>`);row([['再玩一次',()=>start(mode),'primary'],['回封面',menu]])}
function pause(){if(state!=='play')return;state='paused';show('<h2>已暫停</h2><p>離開分頁也會自動暫停。</p>');row([['繼續',()=>{state='play';$('overlay').classList.add('hidden');$('pause').classList.remove('hidden')},'primary'],['結束本局',()=>end(true)]])}
function shop(){show(`<h2>永久強化</h2><p>潮屑 ${meta.money}。不套用於每日潮。</p>`);for(const [key,name,desc,max,base]of[['life','持久折光','每級壽命 +0.3 秒',5,6],['health','潮息擴張','每級上限 +12',3,8],['bonus','分數共鳴','每級得分 +6%',5,10]]){const cost=base+meta[key]*4,b=button('',`${name} ${meta[key]}/${max} · ${desc} · ${cost} 潮屑`,()=>{meta.money-=cost;meta[key]++;save();hud();shop()},'choice');b.disabled=meta[key]>=max||meta.money<cost;$('panel').append(b)}row([['金紙',()=>{meta.skin='gold';save();shop()}],['琉璃',()=>{meta.skin='glass';save();shop()}],['回封面',menu]])}
function codex(){show(`<h2>圖鑑與成就</h2><p>青孢子：基本目標。<br>金孢子：較高得分、回復更多潮息。<br>巡孢子：繞圈移動。<br>裂孢子：裂成兩顆小孢子。<br>螢孢子：體積較小、轉動更快。<br>暗礁：碰撞扣潮息。<br>潮符：回息／緩潮／延長現有折光。<br>潮核：每五潮出現，打中多次擊破。<br>三折回聲：兩秒內反射三次，短時間自動收集附近一顆孢子。</p><h2>成就</h2><p>${['初潮完成','五連擊','採集三十','潮核碎裂','五潮之後','十潮'].map(a=>(meta.ach.includes(a)?'已達成':'未達成')+' · '+a).join('<br>')}</p><p class="note">每日潮固定關卡亂數與強化選項；並非連線排行榜。存檔只在目前裝置與網站中保存。</p>`);row([['回封面',menu]])}
function place(a,b){let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;if(len<18){const s=Math.hypot(g.p.vx,g.p.vy);dx=-g.p.vy/s;dy=g.p.vx/s;len=Math.min(100,A.r*.8);cx=a.x;cy=a.y}else{dx/=len;dy/=len;len=Math.max(28,Math.min(len,150,A.r*1.1))}if(Math.hypot(cx-A.x,cy-A.y)>A.r+20)return;const life=Math.max(1.8,4.5-g.wave*.07)+g.runLife+(mode==='daily'?0:meta.life*.3);g.mirrors.push({x1:cx-dx*len/2,y1:cy-dy*len/2,x2:cx+dx*len/2,y2:cy+dy*len/2,life,max:life,cool:0});if(g.mirrors.length>5)g.mirrors.shift();beep(530)}
canvas.onpointerdown=e=>{if(state!=='play'||pointer)return;canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,x:e.clientX,y:e.clientY,endX:e.clientX,endY:e.clientY}};canvas.onpointermove=e=>{if(pointer&&pointer.id===e.pointerId){pointer.endX=e.clientX;pointer.endY=e.clientY}};canvas.onpointerup=e=>{if(pointer&&pointer.id===e.pointerId){if(state==='play')place(pointer,{x:e.clientX,y:e.clientY});pointer=null}};canvas.onpointercancel=()=>pointer=null;$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pause()}});
